name: 构建 rubens Ubuntu 26.04

# ─────────────────────────────────────────────────────────────────────────────
# 这个仓库里**只放从 GitHub 下载不到的文件**：
#
#   firmware/           厂商固件（WiFi / 蓝牙 / Mali / 触摸屏），版权原因无法从网上获取
#   ramdisk-proven.lz4  在真机上验证过能启动的 initramfs 基线
#   configs/            内核配置（实测可启动）
#   patches/            移植补丁
#   scripts/            构建脚本
#
# 内核源码与 rootfs 构建器都在运行时从 GitHub 克隆，不需要放进仓库。
#
# 手动触发时可以指定内核来源（仓库地址 / 分支 / commit），见下面 inputs。
#
# ── 为什么跑在 ubuntu:26.04 容器里而不是 runner 直接跑 ──
#
# GitHub 托管 runner 目前只有 ubuntu-24.04，它自带的工具链与本移植的验证环境
# 不符，而且是**硬阻塞**而非"可能有问题"：
#
#   clang        24.04 最高 18.1.3，本移植需要 21（18 编不过内核）
#   lz4          24.04 是 1.9.4，它在 legacy 模式下产出的流内核解压不了 ——
#                会导致 boot.img 直接启动失败（见 docs/PITFALLS.md §10）
#   mmdebstrap   24.04 是 1.4.3，构建 26.04 rootfs 的可靠性未知
#
# ubuntu:26.04 容器里 apt 直接给出 clang 21 / lz4 1.10 / mmdebstrap 1.5，
# 与本地验证环境完全一致，且跑在 GitHub 自己的 runner 上，不花钱。
# ─────────────────────────────────────────────────────────────────────────────

on:
  workflow_dispatch:
    inputs:
      kernel_repo:
        description: '内核仓库地址（留空 = 使用默认 MT6895-Mainline/linux）'
        required: false
        default: ''
        type: string

      kernel_branch:
        description: '分支名（留空：若填了地址则用该仓库的主分支；什么都没填则用 port/rubens-clean）'
        required: false
        default: ''
        type: string

      kernel_commit:
        description: '完整或简写 commit / tag（留空 = 使用该分支的最新提交）'
        required: false
        default: ''
        type: string

      build_desktop:
        description: '把 GNOME 桌面打进系统镜像（镜像会从约 130 MB 涨到约 1.5 GB）'
        required: false
        default: false
        type: boolean

      force_kernel_rebuild:
        description: '忽略内核缓存，强制重编内核（改了补丁/配置却想复用旧 workflow 时用）'
        required: false
        default: false
        type: boolean

env:
  # 默认内核来源与基线（实测可启动的组合）
  DEFAULT_KERNEL_REPO:   https://github.com/MT6895-Mainline/linux.git
  DEFAULT_KERNEL_BRANCH: port/rubens-clean
  DEFAULT_KERNEL_COMMIT: 80d38270aacdcb17db3cba8cfb522bf248f354f6

  ROOTFS_REPO:    https://github.com/MT6895-Mainline/rootfs.git
  KERNEL_RELEASE: "7.2.0"

  # LK 是厂商 bootloader，有硬性体积上限：
  #   0x3640000 实测能启动；0x3820000 会复位循环。超过就别刷。
  IMAGE_SIZE_BUDGET: "0x3640000"

  # 内核缓存的版本号。**改了内核配置、补丁或构建方式就把它 +1**，
  # 否则会命中旧的、与新配置不匹配的缓存。
  CACHE_VERSION: v1

jobs:
  build:
    # 只是宿主；真正的构建环境是下面的容器
    runs-on: ubuntu-26.04
    container:
      image: ubuntu:26.04      # 与本地验证环境一致的工具链
      options: --user root
    timeout-minutes: 180

    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      # ────────────────────────────────────────────── 1. 安装工具链
      - name: 安装编译工具链
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends sudo \
            clang lld llvm \
            make bc bison flex libssl-dev libelf-dev \
            device-tree-compiler \
            cpio gzip xz-utils zstd lz4 \
            python3 python3-pip \
            git rsync patch curl wget ca-certificates \
            mmdebstrap qemu-user-binfmt \
            kmod e2fsprogs util-linux \
            android-sdk-libsparse-utils \
            mkbootimg

      - name: 检查工具链版本
        run: |
          set -euxo pipefail
          . /etc/os-release
          echo "构建环境: $PRETTY_NAME"
          clang --version | head -1
          ld.lld --version | head -1
          echo "mmdebstrap: $(mmdebstrap --version)"
          echo "lz4: $(/usr/bin/lz4 --version 2>&1 | head -1)"
          echo "make: $(make --version | head -1)"

          CLANG=$(clang --version | grep -oP 'version \K[0-9]+' | head -1)
          LZ4V=$(/usr/bin/lz4 --version 2>&1 | grep -oP 'v\K[0-9.]+')
          MMDB=$(mmdebstrap --version | awk '{print $2}')

          fail=0
          # clang：本移植用 21.1.8 验证；20 以上应可用，低于 20 编不过
          [ "$CLANG" -ge 20 ] || { echo "::error::clang $CLANG 太旧（需要 20+）"; fail=1; }
          # lz4：1.9.x 在 legacy 模式下产出的流内核解压不了
          case "$LZ4V" in
            1.9.*) echo "::error::lz4 $LZ4V 会在 legacy 模式下产出内核不认的流"; fail=1 ;;
          esac
          # mmdebstrap：构建 Ubuntu 26.04 rootfs 建议 1.5+
          case "$MMDB" in
            1.[0-4].*|1.[0-4]) echo "::warning::mmdebstrap $MMDB 偏旧，构建可能失败" ;;
          esac
          [ "$fail" = 0 ] || exit 1
          echo "✅ 工具链满足要求"

          # 打包 boot.img 需要的两个工具
          #
          # 注意：mkbootimg 在 Ubuntu 26.04 里是 universe 的正式包
          # （source: android-platform-tools），直接用 apt 装即可。
          # 不要用 pip —— 26.04 是 PEP 668 的 externally-managed 环境，
          # pip 会拒绝安装（除非加 --break-system-packages）。
          for t in mkbootimg simg2img; do
            printf '  %-12s %s\n' "$t" "$(command -v $t || echo '❌ 缺失')"
            command -v "$t" >/dev/null 2>&1 || { echo "::error::$t 不可用"; fail=1; }
          done
          mkbootimg --help >/dev/null 2>&1 && echo "  mkbootimg 可正常执行"
          [ "$fail" = 0 ] || exit 1

      # 预检 build.sh 要求的**全部**宿主工具。
      #
      # 这条单独成步是有代价换来的：run 8 在 rootfs 阶段死在
      #   error: missing host tool: depmod
      # 而那时内核已经编了 77 分钟。容器是精简的 ubuntu:26.04，
      # 这些工具不会"顺便"带上，必须显式安装 + 显式检查。
      #
      # 清单与 rootfs/build.sh 里那一行保持一致：
      #   for tool in mmdebstrap mkfs.ext4 zstd du findmnt depmod
      # 另加 build.sh 实际会调用、但不在该循环里的 img2simg / llvm-strip。
      - name: 预检 rootfs 构建所需的宿主工具
        run: |
          set -euxo pipefail
          fail=0
          check() {
            if command -v "$1" >/dev/null 2>&1; then
              printf '  ✅ %-12s %s\n' "$1" "$(command -v "$1")"
            else
              printf '  ❌ %-12s 缺失（包: %s）\n' "$1" "$2"
              fail=1
            fi
          }
          echo "build.sh 的 requires 列表："
          check mmdebstrap  mmdebstrap
          check mkfs.ext4   e2fsprogs
          check zstd        zstd
          check du          coreutils
          check findmnt     util-linux
          check depmod      kmod
          echo "build.sh 会调用但不在 requires 列表里的："
          check img2simg    android-sdk-libsparse-utils
          check llvm-strip  llvm
          [ "$fail" = 0 ] || { echo "::error::容器缺少 rootfs 构建所需的宿主工具"; exit 1; }
          echo "✅ 宿主工具齐备"

      # ────────────────────────────────────────────── 2. 解析内核来源
      # 优先级规则（对应 workflow_dispatch 的三个输入框）：
      #   地址留空            -> 用默认仓库
      #   填了地址、分支留空   -> 用该仓库的主分支
      #   填了分支、commit 留空 -> 用该分支的最新提交
      #   三个都留空          -> 默认仓库 + 默认分支 + 默认 commit
      - name: 解析内核来源参数
        id: src
        run: |
          set -euxo pipefail

          REPO="${{ inputs.kernel_repo }}"
          BRANCH="${{ inputs.kernel_branch }}"
          COMMIT="${{ inputs.kernel_commit }}"

          if [ -z "$REPO" ]; then
            # 地址留空：完全使用默认组合
            REPO="$DEFAULT_KERNEL_REPO"
            BRANCH="${BRANCH:-$DEFAULT_KERNEL_BRANCH}"
            # 只有分支也是默认值时才沿用被验证过的 commit
            if [ "$BRANCH" = "$DEFAULT_KERNEL_BRANCH" ] && [ -z "$COMMIT" ]; then
              COMMIT="$DEFAULT_KERNEL_COMMIT"
            fi
          else
            # 填了地址
            if [ -z "$BRANCH" ]; then
              # 分支留空 -> 探测该仓库的主分支
              echo "未指定分支，探测 $REPO 的主分支..."
              BRANCH=$(git ls-remote --symref "$REPO" HEAD 2>/dev/null \
                       | awk '/^ref:/ {sub("refs/heads/","",$2); print $2; exit}')
              [ -n "$BRANCH" ] || BRANCH="master"
              echo "探测到主分支: $BRANCH"
            fi
          fi

          echo "内核仓库: $REPO"
          echo "分支    : $BRANCH"
          echo "commit  : ${COMMIT:-<最新>}"

          {
            echo "repo=$REPO"
            echo "branch=$BRANCH"
            echo "commit=$COMMIT"
          } >> "$GITHUB_OUTPUT"

      # ────────────────────────────────────────────── 3. 克隆内核
      - name: 克隆内核源码
        run: |
          set -euxo pipefail
          REPO="${{ steps.src.outputs.repo }}"
          BRANCH="${{ steps.src.outputs.branch }}"
          COMMIT="${{ steps.src.outputs.commit }}"

          # 用 blob 过滤克隆：历史完整（能解析任意 SHA），但不下载文件内容，
          # checkout 时才按需拉取，比全量克隆快很多。
          git clone --filter=blob:none "$REPO" kernel
          cd kernel
          git config --global --add safe.directory "$PWD"

          # COMMIT 可能是三种形态，处理方式不同：
          #   1. 完整 40 位 SHA  -> git fetch 可以直接取（GitHub 支持）
          #   2. tag 名          -> git fetch 可以取
          #   3. 短 SHA          -> **远端无法解析**（Git 协议不接受简写），
          #                         必须先把分支历史取下来再在本地匹配
          # 之前的写法直接 `git fetch origin 80d38270aa` 就会失败：
          #   fatal: couldn't find remote ref 80d38270aa
          TARGET=""

          if [ -z "$COMMIT" ]; then
            echo "未指定 commit，取分支 $BRANCH 的最新提交"
            git fetch --depth 1 origin "$BRANCH"
            git checkout -b "$BRANCH" FETCH_HEAD
            TARGET="$BRANCH 最新"
          else
            echo "指定了 commit/tag: $COMMIT"

            if [ ${#COMMIT} -eq 40 ] && [[ "$COMMIT" =~ ^[0-9a-fA-F]{40}$ ]]; then
              echo "  识别为完整 SHA"
              git fetch --depth 1 origin "$COMMIT"
              git checkout "$COMMIT"
            elif git fetch --depth 1 origin "refs/tags/$COMMIT" 2>/dev/null; then
              echo "  识别为 tag"
              git checkout "FETCH_HEAD"
            else
              echo "  识别为短 SHA 或分支名，拉取 $BRANCH 的历史后在本地匹配"
              # 先试深层浅取，失败再全量取该分支
              if ! git fetch --depth 200 origin "$BRANCH" 2>/dev/null; then
                echo "  浅取失败，改为取该分支的完整历史"
                git fetch origin "$BRANCH"
              fi
              FULL=$(git rev-parse --verify "${COMMIT}^{commit}" 2>/dev/null || true)
              if [ -z "$FULL" ]; then
                echo "::error::在 $BRANCH 的历史里找不到 commit '$COMMIT'"
                echo "提示：若该 commit 不在这个分支上，请把分支名也填上正确的值。"
                echo "该分支最近 10 个提交："
                git log --oneline -10 FETCH_HEAD 2>/dev/null | sed 's/^/  /'
                exit 1
              fi
              echo "  解析为完整 SHA: $FULL"
              git checkout "$FULL"
            fi
            TARGET="$COMMIT"
          fi

          git checkout -b rubens-ubuntu 2>/dev/null || git checkout -B rubens-ubuntu
          echo
          echo "已检出（目标: $TARGET）:"
          git log --oneline -1
          git status --porcelain | head

      # ────────────────────────────────────────────── 4. 恢复内核缓存（跨 run 复用）
      #
      # 实测这台 runner 编一次内核要 **77 分钟**。如果每次重试都从头编，
      # 那"后面的步骤失败"就要再等一个多小时。这里把编译结果按
      # 内核来源 + 配置 + 补丁的指纹缓存起来，下一次直接命中、跳过编译。
      #
      # 缓存只存**构建产物**（4.6 GB，压缩后约 1 GB），不存源码：
      # build.sh 本来就会用 `git archive` 把源码铺回去，所以源码不必进缓存。
      #
      # 命中后 build_image/dtbs/modules 三步整体跳过；build.sh 那边仍会把
      # 这棵树当成它的内核缓存（见「把编译结果做成 build.sh 的内核缓存」）。
      #
      # 刻意**不设 restore-keys**：前缀回退会命中"别的 commit / 别的配置"编出来的
      # 内核，而内核与 /lib/modules 必须严格配对，用错会静默产出模块全部失配的
      # 镜像。宁可缓存不命中、重编一次，也不要拿错的内核。
      - name: 恢复内核缓存
        id: kcache
        uses: actions/cache/restore@v4
        with:
          path: kernel-cache
          key: >-
            kernel-${{ env.CACHE_VERSION }}-${{
              inputs.force_kernel_rebuild == true && 'nocache' ||
              format('{0}-{1}', steps.src.outputs.commit, hashFiles('configs/kernel.config', 'configs/mt6895-fixups.config', 'patches/0001-rubens-port-fixes.patch'))
            }}

      - name: 判断是否真的要编内核
        run: |
          HIT="${{ steps.kcache.outputs.cache-hit }}"
          if [ "${{ inputs.force_kernel_rebuild }}" = "true" ]; then
            HIT="false"
            echo "指定了 force_kernel_rebuild，忽略缓存"
          fi
          if [ "$HIT" = "true" ] && [ -f kernel-cache/arch/arm64/boot/Image ] \
             && [ -f kernel-cache/Module.symvers ] && [ -f kernel-cache/.config ] \
             && [ -f kernel-cache/include/config/kernel.release ]; then
            echo "SKIP_KERNEL_BUILD=1" >> "$GITHUB_ENV"
            echo "✅ 内核缓存命中 —— 跳过编译（省下约 77 分钟）"
            echo "   Image : $(stat -c %s kernel-cache/arch/arm64/boot/Image) 字节"
            echo "   模块  : $(find kernel-cache -name '*.ko' | wc -l) 个"
            echo "   版本  : $(cat kernel-cache/include/config/kernel.release)"
          else
            echo "SKIP_KERNEL_BUILD=0" >> "$GITHUB_ENV"
            if [ "$HIT" = "true" ]; then
              echo "::warning::缓存标记命中但内容不完整，改为重新编译"
            else
              echo "未命中内核缓存 —— 本次会完整编译（约 77 分钟）"
            fi
          fi
          # build.sh 需要一个**带 .git 的内核仓库**来铺源码（缓存命中时会跑
          # `git -C "$KERNEL_REPO" archive`）。kernel/ 因此始终是全新克隆，
          # 不依赖缓存里是否保住了嵌套的 .git —— 那是 actions/cache 的常见坑。
          [ -d kernel/.git ] || { echo "::error::kernel/ 不是 git 仓库"; exit 1; }
          echo "内核源码仓库 kernel/ 就绪（含 .git）"

      - name: 应用移植补丁
        if: env.SKIP_KERNEL_BUILD != '1'
        id: patch
        run: |
          set -euxo pipefail
          cd kernel
          git config --global --add safe.directory "$PWD"
          git config --global user.name ci
          git config --global user.email ci@localhost
          git am --3way ../patches/0001-rubens-port-fixes.patch
          # 工作区必须干净：否则 setlocalversion 会给内核版本追加 '+'，
          # 导致 uname -r 变成 7.2.0+ 而 /lib/modules/7.2.0 里的模块全部失配
          git status --porcelain
          test -z "$(git status --porcelain)" || {
            echo "::error::工作区不干净，内核版本号会带 + 后缀"
            exit 1
          }
          git log --oneline -2

      # ────────────────────────────────────────────── 5b. 补丁失败时的指引
      # 换用别的内核 commit 时，补丁可能对不上。这里把冲突细节打出来，
      # 方便判断是需要改补丁，还是换个基线。
      - name: 补丁冲突排查
        if: failure() && steps.patch.outcome == 'failure'
        run: |
          cd kernel || exit 0
          echo "::group::无法应用的 hunk"
          git am --show-current-patch=diff 2>/dev/null | head -80 || true
          echo "::endgroup::"
          echo "::group::冲突文件"
          git status --short 2>/dev/null || true
          echo "::endgroup::"
          echo "提示：若换了内核基线，patches/0001-rubens-port-fixes.patch"
          echo "      可能需要重新生成（见 docs/BUILD.md §3.1）。"

      # ────────────────────────────────────────────── 6. 配置内核
      # ────────────────────────────────────────────── 6b. 清理源码树
      # 上游 MT6895-Mainline/linux 把内核构建产物也提交进了仓库
      # （include/config、include/generated 等）。而 make 的 outputmakefile 规则
      # 会据此判定"源码树不干净"，直接拒绝在 O=out 里构建：
      #
      #   UPD     .../kernel/out/Makefile
      #   ***
      #   *** The source tree is not clean, please run 'make ARCH=arm64 mrproper'
      #   *** in .../kernel
      #   ***
      #   make[2]: *** [kernel/Makefile:709: outputmakefile] Error 1
      #
      # 注意 --filter=blob:none 解决不了这个问题：它只跳过 blob 内容的下载，
      # tracked 文件照样会检出。
      #
      # 顺序很重要：mrproper 会把 .config 一起删掉，所以必须在写配置之前跑。
      - name: 清理内核源码树
        if: env.SKIP_KERNEL_BUILD != '1'
        run: |
          set -euxo pipefail
          cd kernel
          make ARCH=arm64 mrproper
          # 兜底：清掉 mrproper 不处理、但仍会让 make 认为不干净的东西
          # （-x 连 .gitignore 覆盖的文件一起清，-d 连目录，-f 强制）
          git clean -xdf
          echo
          echo "清理后的状态："
          git status --porcelain | head || true
          for p in include/config include/generated .config; do
            if [ -e "$p" ]; then
              echo "::warning::$p 仍然存在，make 可能仍报 'not clean'"
            else
              echo "  ✅ $p 已清除"
            fi
          done

      # ────────────────────────────────────────────── 6c. 写入内核配置
      #
      # 配置文件必须放到【输出目录】的 .config，不能放源码树根的 .config。
      # 内核的 outputmakefile 规则（Makefile:709）会检查三个条件，任一为真就
      # 判定源码树不干净并拒绝构建：
      #
      #   [ -f $(srctree)/.config -o \
      #     -d $(srctree)/include/config -o \
      #     -d $(srctree)/arch/$(SRCARCH)/include/generated ]
      #
      # 而 `O=out` 模式下，$(srctree) 指的是源码树根 —— 所以把 .config 放在那里
      # 正好触发第一个条件。正确的位置是 out/.config。
      #
      # 之前踩过的两次坑，都是为了绕开这个自己造成的错误：
      #   1. 以为 --filter=blob:none 能解决（它只影响下载，不影响检出）
      #   2. 加 mrproper + git clean（对源码树根那个 .config 完全无用，
      #      因为它是我们自己刚 cp 进去的）
      - name: 写入内核配置
        if: env.SKIP_KERNEL_BUILD != '1'
        run: |
          set -euxo pipefail
          cd kernel

          # 配置放在**源码树根**，做 in-tree 构建。原因见下面「编译内核与模块」：
          # in-tree 产出的树正是 rootfs/build.sh 的缓存形状（$KBOUT），
          # 这样内核只编一遍，而不是让它再编一遍。
          #
          # 这里之所以合法（不像 `O=out` 那样触发 Makefile:709 的守卫）：
          # 那个守卫整段包在 `ifdef building_out_of_srctree` 里，而
          # `building_out_of_srctree` 只在 srcroot != CURDIR（即用了 O=）时才被赋值。
          # in-tree 构建根本不进入那段判断。（已核对 Makefile:255-262 与 679-707）
          cp ../configs/kernel.config .config

          make ARCH=arm64 LLVM=1 olddefconfig

          echo "抽查关键配置项："
          grep -E '^CONFIG_XIAOMI_RUBENS=y'           .config
          grep -E '^CONFIG_MTK_COMBO=y'               .config
          grep -E '^CONFIG_MTK_BTIF=y'                .config
          grep -E '^CONFIG_MTK_TINYSYS_SCP_SUPPORT=y' .config
          grep -E '^CONFIG_PSTORE_BLK=y'              .config
          grep -E '^CONFIG_DRM_PANTHOR=y'             .config
          grep -qE '^# CONFIG_KALLSYMS_ALL is not set' .config

          # 构建形态自检：必须是 in-tree（否则缓存形状不对，会白等一轮编译）
          [ ! -e Makefile.bak ] || true
          if [ -e include/config/auto.conf ] && [ ! -e out ]; then
            echo "确认：in-tree 构建树"
          fi

      # ────────────────────────────────────────────── 7. 编译内核
      # 必须先单独编 dtbs：arch/arm64/kernel/Makefile 里的 DTB 规则标了 FORCE，
      # 而它调用子 make 时漏传 O=$(objtree)，会跑回源码树找 .config 而失败。
      # 先编 dtbs 把文件落到盘上，该规则随后成为 no-op。
      - name: 编译设备树
        if: env.SKIP_KERNEL_BUILD != '1'
        run: |
          set -euxo pipefail
          cd kernel
          make -C . ARCH=arm64 LLVM=1 dtbs
          test -f arch/arm64/boot/dts/mediatek/mt6895-xiaomi-rubens.dtb

      - name: 编译内核与模块
        if: env.SKIP_KERNEL_BUILD != '1'
        run: |
          set -euxo pipefail
          cd kernel
          # in-tree 构建（无 O=out）：产出的树就是 rootfs/build.sh 的缓存形状，
          # build.sh 随后会命中缓存并**跳过它自己那次编译**。
          # LOCALVERSION= 显式设为空串，阻止 setlocalversion 追加 '+'
          LOCALVERSION= make -C . ARCH=arm64 LLVM=1 \
            -j"$(nproc)" Image modules 2>&1 | tail -30

      # 统一「这次用哪棵树」：命中缓存就是 kernel-cache/，否则是刚编好的 kernel/。
      # 后面所有步骤（校验、build.sh、boot.img、校验和、摘要）都只认 $KERNEL_DIR，
      # 这样两条路径不会各写一套常量而慢慢走偏。
      - name: 确定本次使用的内核树
        run: |
          set -euxo pipefail
          if [ "${SKIP_KERNEL_BUILD:-0}" = "1" ]; then
            DIR=kernel-cache
          else
            DIR=kernel
          fi
          for f in arch/arm64/boot/Image .config Module.symvers \
                   include/config/kernel.release; do
            [ -f "$DIR/$f" ] || { echo "::error::$DIR 缺 $f"; exit 1; }
          done
          N=$(find "$DIR" -name '*.ko' | wc -l)
          [ "$N" -gt 1500 ] || { echo "::error::$DIR 只有 $N 个 .ko"; exit 1; }
          echo "KERNEL_DIR=$DIR" >> "$GITHUB_ENV"
          echo "本次内核树: $DIR（$N 个 .ko，$(du -sh "$DIR" | cut -f1)）"

      # ────────────────────────────────────────────── 8. 门禁校验
      - name: 校验内核（体积 / 版本 / 配置 / DTB）
        run: ./scripts/verify-kernel.sh "$KERNEL_DIR"

      # 未命中缓存时，把刚编好的 kernel/ 复制成 kernel-cache/，
      # 于是**两条路径之后完全一致**，且这份就是最后要存进 actions/cache 的东西。
      # 命中时它已经存在，什么都不用做。
      - name: 未命中缓存时建立 kernel-cache
        if: env.SKIP_KERNEL_BUILD != '1'
        run: |
          set -euxo pipefail
          rm -rf kernel-cache
          NEED_KB=$(du -sk kernel | cut -f1)
          AVAIL_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          echo "需要 $((NEED_KB/1024)) MB / 可用 $((AVAIL_KB/1024)) MB"
          [ "$AVAIL_KB" -ge "$NEED_KB" ] || { echo "::error::空间不足"; df -h .; exit 1; }
          cp -a kernel kernel-cache
          echo "已建立 kernel-cache（$(du -sh kernel-cache | cut -f1)）"

      # ────────────────────────────────────────────── 9. 构建系统镜像
      - name: 克隆 rootfs 构建器
        run: git clone --depth 1 "$ROOTFS_REPO" rootfs-builder

      # 这一步是**整个流程能不能在 180 分钟里跑完的关键**：实测这台 runner
      # 编一次内核要 77 分钟。如果不复用，workflow 编一遍 + build.sh 再编一遍
      # ≈154 分钟，加上 rootfs 必然超时。
      #
      # 缓存的形状必须是「源码树根」（$KBOUT），因为 build.sh 会：
      #   cp -a "$KERNEL_CACHE/." "$KBOUT/"
      #   git -C "$KERNEL_REPO" archive <commit> | tar -x -C "$KBOUT" --keep-old-files
      #   make -C "$KBOUT" modules_install
      # 而上面的内核就是 in-tree 构建的，产出的树天然是这个形状：
      # Makefile 是**真的内核 Makefile**，不是 `O=out` 那层写死绝对路径的包装器
      # （包装器会让 make 跳回 kernel/out，$KBOUT 完全失效）。
      - name: 把编译结果做成 build.sh 的内核缓存
        run: |
          set -euxo pipefail
          mkdir -p rootfs-builder/out
          rm -rf rootfs-builder/out/kernel-cache

          # 直接用 $KERNEL_DIR：它已经是「缓存未命中=kernel/ / 命中=kernel-cache/」，
          # 两条路都保证是 $KBOUT 形状（真内核 Makefile），无需再区分。
          NEED_KB=$(du -sk "$KERNEL_DIR" | cut -f1)
          AVAIL_KB=$(df -Pk . | awk 'NR==2 {print $4}')
          echo "来源 : $KERNEL_DIR"
          echo "需要 : $((NEED_KB/1024)) MB / 可用 $((AVAIL_KB/1024)) MB"
          if [ "$AVAIL_KB" -lt "$NEED_KB" ]; then
            echo "::error::磁盘空间不足（需 $((NEED_KB/1024)) MB，可用 $((AVAIL_KB/1024)) MB）"
            df -h .
            exit 1
          fi

          cp -a "$KERNEL_DIR" rootfs-builder/out/kernel-cache

          CACHE=rootfs-builder/out/kernel-cache
          for f in arch/arm64/boot/Image .config Module.symvers \
                   include/config/kernel.release; do
            test -f "$CACHE/$f" || { echo "::error::缓存缺 $f"; exit 1; }
          done

          # 形状自检：Makefile 必须是真内核 Makefile，不能是 O=out 包装器。
          #
          # 判据必须是**第一行**，不能是「文件里包含该字符串」——真内核
          # Makefile 第 698 行就有这句（它正是生成包装器的那段代码）：
          #   echo "\# Automatically generated by $(abs_srctree)/Makefile: don't edit"
          # 所以整文件 grep 会把真 Makefile 误判成包装器。
          FIRST=$(head -1 "$CACHE/Makefile")
          echo "Makefile 首行: $FIRST"
          case "$FIRST" in
            '# Automatically generated by'*)
              echo "::error::缓存是 O=out 包装器形状，build.sh 会跳回错误路径"
              head -3 "$CACHE/Makefile"
              exit 1 ;;
            '# SPDX-License-Identifier:'*)
              echo "✅ 缓存形状正确（真内核 Makefile），build.sh 将跳过内核编译" ;;
            *)
              echo "::warning::Makefile 首行不是预期值，请人工确认"
              head -3 "$CACHE/Makefile" ;;
          esac

          REL=$(cat "$CACHE/include/config/kernel.release")
          echo "缓存内核版本 : $REL"
          echo "Image        : $(stat -c %s "$CACHE/arch/arm64/boot/Image") 字节"
          echo "模块         : $(find "$CACHE" -name '*.ko' | wc -l) 个"
          echo "大小         : $(du -sh "$CACHE" | cut -f1)"
          echo "REL=$REL" >> "$GITHUB_ENV"

      # 上游 MT6895-Mainline/rootfs 的 devices/ 里只有
      #   pearl.conf  qqcandy.conf  rubens.conf  xaga.conf
      # 没有 rubens-ubuntu.conf —— 那是本地迭代时新建的 profile。
      # 同理 distros/ 里只有 debian.sh，没有 ubuntu.sh。
      # 这两个文件都不在 GitHub 上，所以由 workflow 现场生成。
      - name: 写入设备 profile
        run: |
          set -euxo pipefail
          cd rootfs-builder
          mkdir -p devices
          cat > devices/rubens-ubuntu.conf <<'CONF_EOF'
          # Device profile: Xiaomi Redmi K50 (rubens) -- Ubuntu 26.04 LTS
          #
          # 由 .github/workflows/build.yml 生成：上游 rootfs 仓库没有这个
          # profile，只有面向 Debian 的 devices/rubens.conf。
          #
          # 内核侧：MT6895-Mainline/linux @ port/rubens-clean (Linux 7.2.0)。
          # CONFIG_XIAOMI_RUBENS=y 让 Image 自带 rubens DTB，setup.c 会覆盖
          # LK 传进来的 FDT，所以 boot.img 的 cmdline 是被忽略的。
          DISTRO="ubuntu"
          SUITE="resolute"

          PLATFORM_NAME="Xiaomi Redmi K50 (rubens)"
          SOC="mt6895"

          KERNEL_BRANCH="HEAD"
          KERNEL_CONFIGS="rubens.config"
          DTS="mt6895-xiaomi-rubens.dts"

          # rubens 移植用 clang 构建（make LLVM=1）；模块必须来自同一工具链。
          KERNEL_MAKE_ARGS="LLVM=1"

          # 空值 = 内核版本就是 7.2.0，不带 "+" 后缀。
          # 模块目录名必须与刷入的内核所报告的一致，否则一个模块都加载不了。
          KERNEL_LOCALVERSION=""

          # 根文件系统：userdata 分区（本机 226 GiB）里的 ext4，
          # 由 mkfs.ext4 -L <label> 创建；initramfs 按 GPT 分区名找到它。
          ROOTFS_LABEL="mt6895rubens"

          # Ubuntu base 自带 uid 1000 的 ubuntu 用户；build.sh 会为它写
          # 免密 sudo 规则（默认的 mobian 用户不存在）。
          DEFAULT_USER="ubuntu"

          # 内核设备节点（不是 fastboot 名字），取自本机：
          #   adb shell su -c 'ls -l /dev/block/by-name/{userdata,nvdata}'
          USERDATA_PART="/dev/sdc86"
          NVDATA_PART="/dev/sdc13"

          PACKAGES_CORE="systemd systemd-sysv systemd-resolved openssh-server sudo kmod"

          # 先做 CLI 可用性：不带桌面环境。以下都在 resolute 的 main/universe 里；
          # distros/ubuntu.sh 逐个安装，装不上的只报告不失败。
          #
          # wpasupplicant 必须有 —— 缺了它 NetworkManager 完全没有无线能力，
          # wlan0 会永远是 unavailable。
          PACKAGES_EXTRA="network-manager bluez modemmanager iio-sensor-proxy \
                          alsa-ucm-conf alsa-utils usbutils pciutils iproute2 \
                          ethtool iw rfkill wireless-regdb wpasupplicant \
                          less nano zstd e2fsprogs dosfstools \
                          curl wget htop tmux ca-certificates apt-utils"

          # 厂商固件必须提供的文件（自带 blob，用 --firmware 安装，不在此分发）。
          FIRMWARE_HINTS="mediatek/mt6895/WIFI mediatek/mt6895/*.bin mali_csffw.bin"
          CONF_EOF
          # heredoc 里为对齐 YAML 而带的前导空格必须去掉，否则 profile 里
          # 的续行反斜杠与变量赋值都会被缩进破坏。
          sed -i 's/^          //' devices/rubens-ubuntu.conf

          # 去掉 heredoc 前导空格后，profile 必须能被 bash 直接 source ——
          # 这是唯一可靠的检查。不能用「不许有行首空格」来判断：
          # PACKAGES_EXTRA 的续行是**故意缩进**的，正是那个缩进让反斜杠续行成立。
          bash -c '. devices/rubens-ubuntu.conf' \
            || { echo "::error::profile 无法被 bash source"; exit 1; }

          # 取值核对：这些变量缺一个，构建就会走错分支或产出会孤儿化模块的镜像
          bash -c '
            set -e
            . devices/rubens-ubuntu.conf
            for v in DISTRO SUITE KERNEL_CONFIGS DTS KERNEL_MAKE_ARGS \
                     ROOTFS_LABEL DEFAULT_USER USERDATA_PART NVDATA_PART \
                     PACKAGES_CORE PACKAGES_EXTRA; do
              [ -n "${!v}" ] || { echo "::error::$v 为空"; exit 1; }
            done
            [ "$DISTRO" = "ubuntu" ] || { echo "::error::DISTRO=$DISTRO"; exit 1; }
            [ "$SUITE" = "resolute" ] || { echo "::error::SUITE=$SUITE"; exit 1; }
            [ -z "$KERNEL_LOCALVERSION" ] \
              || { echo "::error::KERNEL_LOCALVERSION 必须为空，否则 uname -r 带 + 会孤儿化全部模块"; exit 1; }
            echo "$PACKAGES_EXTRA" | grep -qw wpasupplicant \
              || { echo "::error::PACKAGES_EXTRA 缺 wpasupplicant（NM 会没有无线能力）"; exit 1; }
            echo "$PACKAGES_EXTRA" | grep -qw wireless-regdb \
              || { echo "::error::PACKAGES_EXTRA 缺 wireless-regdb"; exit 1; }
            echo "profile 变量核对通过；PACKAGES_EXTRA 共 $(echo $PACKAGES_EXTRA | wc -w) 个包"
          '

          # 桌面输入：把 GNOME 最小桌面追加进包列表（镜像会从约 130 MB
          # 涨到约 1.5 GB）。distros/ubuntu.sh 逐个装包，装不上只报告。
          if [ "${{ inputs.build_desktop }}" = "true" ]; then
            sed -i 's/ca-certificates apt-utils"/ca-certificates apt-utils ubuntu-desktop-minimal"/' \
              devices/rubens-ubuntu.conf
            bash -c '
              . devices/rubens-ubuntu.conf
              echo "$PACKAGES_EXTRA" | grep -qw ubuntu-desktop-minimal \
                || { echo "::error::桌面包未加入"; exit 1; }
            '
            echo "已加入 ubuntu-desktop-minimal"
          fi
          echo "--- 生成的 profile ---"
          cat devices/rubens-ubuntu.conf

      # 上游 distros/ 只有 debian.sh。Ubuntu 的 arm64 在 ports 源上
      # （archive.ubuntu.com 没有 arm64 包），必须有独立后端。
      - name: 写入 Ubuntu 发行版后端
        run: |
          set -euxo pipefail
          cd rootfs-builder
          mkdir -p distros
          cat > distros/ubuntu.sh <<'UBUNTU_SH_EOF'
          #!/usr/bin/env bash
          # Ubuntu backend for build.sh
          #
          # build.sh 调用约定：
          #   distro_bootstrap <rootfs> <suite> <arch> <mirror> <jobs>
          #   distro_configure <rootfs> <suite>
          #
          # 与 distros/debian.sh 的区别：arm64 不是 Ubuntu 的主架构，
          # 归档在 ports.ubuntu.com/ubuntu-ports，而不是
          # archive.ubuntu.com/ubuntu。pocket 短名（如 resolute）一致，
          # 所以 <suite>/<suite>-updates/<suite>-security 三段同名可用。
          #
          # 已对 Ubuntu 26.04 LTS "Resolute Raccoon" 验证。

          # Ubuntu 没有 non-free-firmware 组件；固件在 main 里，
          # 设备 blob 由 --firmware 提供。
          UBUNTU_COMPONENTS="${UBUNTU_COMPONENTS:-main,universe}"

          # 默认镜像：清华 TUNA，含完整 Ubuntu ports arm64 归档。
          # 可用 --mirror 或 UBUNTU_PORTS_MIRROR 覆盖。
          # 备选：mirrors.ustc.edu.cn / mirrors.aliyun.com / mirrors.huaweicloud.com
          UBUNTU_PORTS_MIRROR="${UBUNTU_PORTS_MIRROR:-https://mirrors.tuna.tsinghua.edu.cn/ubuntu-ports}"

          # Ubuntu 专有包名。device profile 的 PACKAGES_CORE / PACKAGES_EXTRA
          # 与 Debian 后端共用，所以只在 Ubuntu 上叫法不同的包列在这里并合并。
          UBUNTU_PACKAGES_CORE="systemd systemd-sysv systemd-resolved \
                                openssh-server sudo kmod locales tzdata"

          distro_bootstrap() {
          	local rootfs="$1" suite="$2" arch="$3" mirror="$4" jobs="$5"
          	local components="$UBUNTU_COMPONENTS"
          	local pkgs
          	pkgs="$(printf '%s %s %s' "${UBUNTU_PACKAGES_CORE:-}" \
          		"${PACKAGES_CORE:-}" "${PACKAGES_EXTRA:-}" \
          		| tr -s ' ' | sed 's/^ //; s/ $//')"

          	# arm64 在 ports 归档上；只在调用方没显式给 --mirror 时覆盖。
          	if [ -z "$mirror" ] && [ "$arch" != "amd64" ] && [ "$arch" != "i386" ]; then
          		mirror="$UBUNTU_PORTS_MIRROR"
          		echo "ubuntu/ports: using $mirror for $arch"
          	fi

          	if ! [ -e /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
          		echo "warning: qemu-aarch64 binfmt handler not registered;" \
          		     "install qemu-user-static + binfmt-support" >&2
          	fi

          	# mmdebstrap 把镜像当**位置参数**，不是选项：
          	#     mmdebstrap [OPTION...] SUITE TARGET [MIRROR...]
          	# 传 --mirror=$url 会以 "Unknown option: mirror" 中止。
          	# 下面的数组在有没有镜像时都能安全展开。
          	local mirror_args=()
          	[ -n "$mirror" ] && mirror_args=("$mirror")

          	mmdebstrap \
          		--architectures="$arch" \
          		--variant=important \
          		--components="$components" \
          		--include="$pkgs" \
          		--aptopt='Apt::Install-Recommends "false"' \
          		--aptopt='Acquire::Retries "3"' \
          		--dpkgopt='path-exclude=/usr/share/doc/*' \
          		--dpkgopt='path-exclude=/usr/share/man/*' \
          		--dpkgopt='path-exclude=/usr/share/locale/*' \
          		"$suite" "$rootfs" ${mirror_args[@]+"${mirror_args[@]}"}

          	# 这些设备上必须有真正的 init 系统
          	if ! [ -e "$rootfs/usr/lib/systemd/systemd" ]; then
          		echo "error: systemd missing in the bootstrapped rootfs" >&2
          		return 1
          	fi
          	# boot.img 里的 initramfs 会执行 switch_root <fs> /sbin/init
          	if ! [ -e "$rootfs/sbin/init" ]; then
          		echo "warning: /sbin/init missing; linking it to systemd" >&2
          		mkdir -p "$rootfs/sbin"
          		ln -sf /lib/systemd/systemd "$rootfs/sbin/init" 2>/dev/null || true
          	fi
          }

          distro_configure() {
          	local rootfs="$1" suite="$2"
          	local user="${DEFAULT_USER:-ubuntu}"
          	local mirror="${MIRROR:-$UBUNTU_PORTS_MIRROR}"
          	local arch="${ARCH:-arm64}"

          	# ---------------------------------------------------------- sources
          	# 必须最先做：ubuntu-base / mmdebstrap 的默认值指向
          	# archive.ubuntu.com，那里没有 arm64 包。
          	cat > "$rootfs/etc/apt/sources.list" <<EOF
          # MT6895-Mainline rootfs (Ubuntu $suite/$arch).  universe 为设备支持包
          # （NetworkManager、BlueZ、ModemManager 等）而启用。
          deb $mirror $suite main universe
          deb $mirror $suite-updates main universe
          deb $mirror $suite-security main universe
          EOF

          	# ---------------------------------------------------------- apt setup
          	if [ -e "$rootfs/etc/resolv.conf" ] || [ -L "$rootfs/etc/resolv.conf" ]; then
          		:
          	else
          		printf 'nameserver 1.1.1.1\nnameserver 8.8.8.8\n' > "$rootfs/etc/resolv.conf"
          	fi

          	# ---------------------------------------------------------- locale/tz
          	chroot "$rootfs" /bin/sh -c '
          		set -e
          		if [ -x /usr/sbin/locale-gen ]; then
          			echo "en_US.UTF-8 UTF-8" > /etc/locale.gen
          			echo "zh_CN.UTF-8 UTF-8" >> /etc/locale.gen
          			locale-gen >/dev/null 2>&1 || true
          		fi
          		ln -sf /usr/share/zoneinfo/Asia/Shanghai /etc/localtime
          		echo Asia/Shanghai > /etc/timezone
          	' || true

          	# ---------------------------------------------------------- extra pkgs
          	# 逐个安装设备支持包：某个包在这个 Ubuntu 版本里不存在时，
          	# 不至于让整个 bootstrap 失败，每一次缺失都会被报告。
          	local pkgs
          	pkgs="$(printf '%s %s' "${PACKAGES_EXTRA:-}" | tr -s ' ' | sed 's/^ //; s/ $//')"
          	if [ -n "$pkgs" ]; then
          		chroot "$rootfs" /bin/sh -c 'apt-get update -qq' || \
          			echo "warning: apt-get update failed" >&2
          		for p in $pkgs; do
          			if chroot "$rootfs" /bin/sh -c \
          				"DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends $p" \
          				>/dev/null 2>&1; then
          				echo "  installed: $p"
          			else
          				echo "  SKIPPED (not installable in $suite): $p" >&2
          			fi
          		done
          	fi

          	# ---------------------------------------------------------- default user
          	# Ubuntu base 自带 ubuntu 用户；profile 可以要求另一个名字。
          	if ! chroot "$rootfs" /bin/sh -c "id $user" >/dev/null 2>&1; then
          		chroot "$rootfs" /bin/sh -c "
          			set -e
          			useradd -m -s /bin/bash -G sudo,audio,video,render,plugdev,netdev,dialout $user
          			passwd -d $user
          		" || echo "warning: could not create user $user" >&2
          	fi

          	# ---------------------------------------------------------- services
          	for unit in systemd-networkd systemd-resolved ssh NetworkManager \
          		    bluetooth ModemManager iio-sensor-proxy; do
          		chroot "$rootfs" systemctl enable "$unit" >/dev/null 2>&1 || true
          	done

          	# MT6895-Mainline：首次启动把根文件系统扩展到整个分区
          	chroot "$rootfs" systemctl enable mt6895-firstboot.service >/dev/null 2>&1 || true

          	# ---------------------------------------------------------- wifi db
          	# 确保 initramfs 里的 regulatory.db 副本有来源。
          	if [ ! -e "$rootfs/lib/firmware/regulatory.db" ] && \
          	   [ -e "$rootfs/usr/lib/firmware/regulatory.db" ]; then
          		mkdir -p "$rootfs/lib/firmware"
          		cp -a "$rootfs/usr/lib/firmware/regulatory.db" \
          		      "$rootfs/usr/lib/firmware/regulatory.db.p7s" \
          		      "$rootfs/lib/firmware/" 2>/dev/null || true
          	fi

          	# ---------------------------------------------------------- apt hygiene
          	rm -rf "$rootfs/var/lib/apt/lists"/* "$rootfs/var/cache/apt"/* 2>/dev/null || true
          }
          UBUNTU_SH_EOF
          sed -i 's/^          //' distros/ubuntu.sh
          chmod 0755 distros/ubuntu.sh
          bash -n distros/ubuntu.sh
          echo "ubuntu.sh 语法 OK（$(wc -l < distros/ubuntu.sh) 行）"

      # 上游 build.sh 有两个必须修的问题（否则内核根本编不出来）：
      #
      # 1. `make vmlinux` 之前没先 `make dtbs`。CONFIG_XIAOMI_RUBENS=y 让
      #    arch/arm64/kernel/Makefile 依赖板级 DTB（要 objcopy 成
      #    rubens-dtb.o，setup.c 再把它装成 initial_boot_params 覆盖 LK 的
      #    FDT）。而生成该 DTB 的规则忘了传 O=$(objtree)，子 make 会跑回源码
      #    树、找不到 .config 而死在：
      #        *** Configuration file ".config" not found!
      #    由于规则标了 FORCE，它每次构建都触发，所以失败总是落在 vmlinux
      #    上——这也正是单独跑 `make dtbs` 看起来正常的原因。
      #    先编 dtbs 会把文件落到盘上，该规则随后成为 no-op。
      #
      # 2. 每次运行都 rm -rf 工作目录并完整重编内核 + 约 1600 个模块
      #    （10-15 分钟），而这与 userspace 步骤（镜像源、包列表、overlay）
      #    完全无关。补丁加入 $OUT/kernel-cache 快速路径，让已有产物可直接复用。
      #
      # 补丁用 patch(1) 施加；下面是原样嵌入的上游 diff。
      - name: 修补 build.sh（dtbs 顺序 + 内核缓存）
        run: |
          set -euxo pipefail
          cd rootfs-builder
          cat > /tmp/0002-kernel-cache.patch <<'PATCH_EOF'
          diff --git a/build.sh b/build.sh
          index d85a804..70c5425 100755
          --- a/build.sh
          +++ b/build.sh
          @@ -141,8 +141,59 @@ KBOUT="$WORK/kernel"
           STUB="rootfs-$DEVICE$NAME_SUFFIX-$TS"
           BASE="$STUB.img"
           IMGF="$OUT/$BASE"
          +
          +# ---------------------------------------------------------------- kernel cache
          +# Compiling the kernel and its ~1500 modules takes 10-15 minutes and does not
          +# depend on anything that changes while iterating on the userspace steps
          +# (mmdebstrap mirror, package list, overlay, ...).  Rebuilding it on every run
          +# wastes that time and, because the kernel build is the first thing to fail,
          +# it also hides later problems behind it.
          +#
          +# When KERNEL_CACHE is set to a directory that already contains a finished
          +# build (an `out/`-style tree: arch/arm64/boot/Image + .config + Module.symvers
          +# + the .ko files), that tree is copied into the work area and steps 0-2 are
          +# skipped entirely.  Populate it with:  KERNEL_CACHE=/path ./build.sh ...
          +# on a successful run, or by copying a previous work directory.
          +# The cache path is IMPLICIT on purpose: $OUT/kernel-cache.
          +#
          +# Relying on an exported KERNEL_CACHE does not work here because build.sh runs
          +# under sudo, and Ubuntu's sudoers has env_reset set, which drops arbitrary
          +# environment variables even when `sudo -E` is used.  Looking in a fixed place
          +# removes that failure mode entirely.
          +#
          +# KERNEL_CACHE can still be set explicitly to point somewhere else.
          +KERNEL_CACHE="${KERNEL_CACHE:-$OUT/kernel-cache}"
          +CACHE_HIT=0
          +if [ -f "$KERNEL_CACHE/arch/arm64/boot/Image" ] \
          +   && [ -f "$KERNEL_CACHE/.config" ] && [ -f "$KERNEL_CACHE/Module.symvers" ]; then
          +	CACHE_HIT=1
          +fi
          +echo "kernel cache: $KERNEL_CACHE (hit=$CACHE_HIT)"
          +if [ "$CACHE_HIT" = "1" ]; then
          +	# The module directory name has to match what the flashed kernel reports,
          +	# or none of the modules load.  The cache records it in
          +	# include/config/kernel.release; refuse a cache whose release disagrees
          +	# with the Makefile version we are about to report.
          +	cached_rel="$(cat "$KERNEL_CACHE/include/config/kernel.release" 2>/dev/null || true)"
          +	if [ -z "$cached_rel" ]; then
          +		echo "  warning: cache has no include/config/kernel.release; not using it"
          +		CACHE_HIT=0
          +	fi
          +	echo "  cached kernel release: ${cached_rel:-<unknown>}"
          +	echo "  cached Image:          $(stat -c%s "$KERNEL_CACHE/arch/arm64/boot/Image") bytes"
          +	echo "  cached modules:        $(find "$KERNEL_CACHE" -name '*.ko' | wc -l) .ko"
          +fi
          +
           rm -rf "$WORK"
           mkdir -p "$ROOTFS" "$KBOUT" "$OUT"
          +if [ "$CACHE_HIT" = "1" ]; then
          +	log "0. reusing the cached kernel build from $KERNEL_CACHE"
          +	cp -a "$KERNEL_CACHE/." "$KBOUT/"
          +	# the exported source tree is still needed for `modules_install` and for
          +	# the version info below
          +	git -C "$KERNEL_REPO" archive --format=tar "$KERNEL_REF" \
          +		| tar -x -C "$KBOUT" --keep-old-files 2>/dev/null || true
          +fi
           # The script runs as root, but later CI steps (build info) write into --out as
           # the invoking user, so hand the directory over when sudo tells us who that is.
           if [ -n "${SUDO_UID:-}" ] && [ -n "${SUDO_GID:-}" ]; then
          @@ -231,7 +282,46 @@ if [ -n "${KERNEL_LOCALVERSION:-}" ]; then
           fi
           echo "kernel release (module directory): $KVER"
           
          +# ---------------------------------------------------------------- cache fast path
          +# When KERNEL_CACHE supplied a finished build, steps 2/2b are pure waste: the
          +# Image, .config, Module.symvers and every .ko are already in $KBOUT.  Skip
          +# straight to the userspace work, which is what actually needs iterating on.
          +if [ "$CACHE_HIT" = "1" ]; then
          +	log "2. kernel image: SKIPPED (cache hit)"
          +	KIMAGE="$KBOUT/arch/arm64/boot/Image"
          +	[ -f "$KIMAGE" ] || die "cache is missing arch/arm64/boot/Image"
          +	echo "  Image:   $(stat -c%s "$KIMAGE") bytes"
          +	echo "  modules: $(find "$KBOUT" -name '*.ko' | wc -l) .ko files"
          +	# KVER must match the cache; the module dir name decides whether they load
          +	KVER="$(cat "$KBOUT/include/config/kernel.release" 2>/dev/null || echo "$KVER_MAKEFILE")"
          +	echo "  kernel release from cache: $KVER"
          +else
           log "2. build the kernel image"
          +# ---------------------------------------------------------------- dtbs FIRST
          +# `make dtbs` MUST run before `make vmlinux` on these branches.
          +#
          +# CONFIG_XIAOMI_RUBENS makes arch/arm64/kernel/Makefile depend on the board DTB
          +# so it can objcopy it into rubens-dtb.o (setup.c then installs it as
          +# initial_boot_params, overriding LK's FDT).  The rule that is supposed to
          +# generate that DTB is broken:
          +#
          +#   $(srctree)/arch/arm64/boot/dts/mediatek/mt6895-xiaomi-rubens.dtb: FORCE
          +#       $(Q)$(MAKE) -C $(srctree) ARCH=arm64 LLVM=1 mediatek/mt6895-xiaomi-rubens.dtb
          +#
          +# It passes no O=$(objtree), so the sub-make runs in the SOURCE tree, finds no
          +# .config and dies with:
          +#   *** Configuration file ".config" not found!
          +#   make[6]: *** [Makefile:892: .config] Error 1
          +#   make[5]: *** [.../arch/arm64/kernel/Makefile:86: ...rubens.dtb] Error 2
          +# Because the rule is marked FORCE it fires on every build, so the failure
          +# always lands on vmlinux -- and only on vmlinux, which is why a plain
          +# `make dtbs` looks like it works.
          +#
          +# Building dtbs first leaves the file on disk, so the broken rule becomes a
          +# no-op for the rest of the build.
          +# shellcheck disable=SC2086
          +make -j"$JOBS" $KERNEL_MAKE_ARGS dtbs
          +
           # `make modules` on its own cannot work in a fresh tree: modpost has no
           # vmlinux.symvers yet and reports every core symbol as undefined.  Building
           # vmlinux first produces it (and gives us the Image the modules belong to,
          @@ -240,18 +330,23 @@ log "2. build the kernel image"
           make -j"$JOBS" $KERNEL_MAKE_ARGS vmlinux
           KIMAGE="$KBOUT/arch/arm64/boot/Image"
           [ -f "$KIMAGE" ] || echo "warning: no Image at $KIMAGE"
          -# best effort: some branches embed the DTB in the Image instead (pearl does)
          -# shellcheck disable=SC2086
          -make -j"$JOBS" $KERNEL_MAKE_ARGS dtbs >/dev/null 2>&1 || true
           
           log "2b. build modules"
           # shellcheck disable=SC2086
           make -j"$JOBS" $KERNEL_MAKE_ARGS modules
          +fi   # end of cache fast path / kernel build
           
           # ---------------------------------------------------------------- userspace
           log "3. bootstrap $DISTRO_NAME/$SUITE ($ARCH)"
           # shellcheck source=/dev/null
           . "$HERE/distros/$DISTRO_NAME.sh"
          +# Export the mirror and arch so both distro_bootstrap (called with them as
          +# arguments) and distro_configure (which reads $MIRROR / $ARCH from the
          +# environment, see distros/ubuntu.sh) resolve to the SAME archive.  Without
          +# this, a backend that defaults its mirror can end up writing a sources.list
          +# that points somewhere other than the one the bootstrap used.
          +export MIRROR ARCH
          +MIRROR="${MIRROR:-${UBUNTU_PORTS_MIRROR:-}}"
           distro_bootstrap "$ROOTFS" "$SUITE" "$ARCH" "$MIRROR" "$JOBS"
           distro_configure "$ROOTFS" "$SUITE"
           
          PATCH_EOF
          # 去掉为对齐 YAML 加上的 10 个前导空格。
          # 只删精确的 10 空格前缀，因此补丁里新增行的 TAB 缩进保持原样，
          # 空行也保持为空。
          sed -i 's/^          //' /tmp/0002-kernel-cache.patch
          patch -p1 --forward < /tmp/0002-kernel-cache.patch
          bash -n build.sh
          echo "build.sh 语法 OK"
          grep -n 'dtbs FIRST\|kernel cache\|export MIRROR ARCH' build.sh

      # build.sh 会命中上面做好的内核缓存（打印 "reusing the cached kernel build"
      # 与 "kernel image: SKIPPED"），所以这里**不重编内核**，只剩 userspace 工作。
      # --kernel-repo 指向 kernel/（**一定是带 .git 的全新克隆**），因为缓存命中时
      # build.sh 要跑 `git -C "$KERNEL_REPO" archive` 把源码铺回 $KBOUT；
      # 而 --kernel-config 取 $KERNEL_DIR 的，保证与模块同源。
      - name: 构建 rootfs（缓存命中时不重编内核）
        run: |
          set -euxo pipefail
          cd rootfs-builder
          sudo ./build.sh \
            --device        rubens-ubuntu \
            --distro        ubuntu \
            --suite         resolute \
            --kernel-repo   "$PWD/../kernel" \
            --kernel-config "$PWD/../$KERNEL_DIR/.config" \
            --firmware      "$PWD/../firmware" \
            --jobs          "$(nproc)" \
            --hostname      rubens \
            --root-password root

      - name: 校验 rootfs
        run: |
          set -euxo pipefail
          cd rootfs-builder
          IMG=$(ls -t out/rootfs-rubens-ubuntu-*-sparse.img | head -1)
          echo "镜像: $IMG ($(stat -c %s "$IMG") 字节)"
          echo "IMG=$IMG" >> "$GITHUB_ENV"
          simg2img "$IMG" /tmp/rootfs.raw

          LABEL=$(dd if=/tmp/rootfs.raw bs=1 skip=$((1024+120)) count=16 2>/dev/null | tr -d '\0')
          [ "$LABEL" = "mt6895rubens" ] || { echo "::error::卷标是 '$LABEL'，应为 mt6895rubens"; exit 1; }
          echo "卷标: $LABEL"

          rm -rf /tmp/mods && mkdir -p /tmp/mods
          debugfs -R "rdump /lib/modules/$REL/kernel /tmp/mods" /tmp/rootfs.raw >/dev/null 2>&1
          N=$(find /tmp/mods -name '*.ko' | wc -l)
          echo "模块数: $N"
          [ "$N" -gt 1000 ] || { echo "::error::模块数异常 ($N)"; exit 1; }

          for p in /sbin/init /lib/systemd/systemd /usr/bin/apt \
                   /usr/bin/nmcli /usr/sbin/wpa_supplicant \
                   /lib/firmware/arm/mali/arch10.8/mali_csffw.bin \
                   /lib/firmware/conninfra.cfg; do
            debugfs -R "stat $p" /tmp/rootfs.raw 2>/dev/null | grep -q '^ *Inode:' \
              || { echo "::error::rootfs 缺少 $p"; exit 1; }
          done
          echo "rootfs 校验通过"

      # ────────────────────────────────────────────── 10. 打包启动镜像
      - name: 打包 boot.img
        run: |
          set -euxo pipefail
          chmod +x scripts/*.sh
          ./scripts/make-bootimg.sh \
            --kernel  "$KERNEL_DIR/arch/arm64/boot/Image" \
            --ramdisk ramdisk-proven.lz4 \
            --firmware firmware \
            --out     boot-ubuntu.img

      # ────────────────────────────────────────────── 11. 产物
      - name: 生成校验和
        run: |
          set -euxo pipefail
          {
            echo "# rubens Ubuntu 26.04 构建产物"
            echo "# 内核来源: ${{ steps.src.outputs.repo }}"
            echo "# 分支:     ${{ steps.src.outputs.branch }}"
            echo "# commit:   ${{ steps.src.outputs.commit }}"
            echo "# 工作流:   ${{ github.sha }}"
            echo
            sha256sum "$KERNEL_DIR/arch/arm64/boot/Image"
            sha256sum "$KERNEL_DIR/arch/arm64/boot/dts/mediatek/mt6895-xiaomi-rubens.dtb"
            sha256sum boot-ubuntu.img
            sha256sum "$IMG"
          } | tee SHA256SUMS

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: rubens-ubuntu-2604-${{ github.run_number }}
          path: |
            kernel-cache/arch/arm64/boot/Image
            kernel-cache/arch/arm64/boot/dts/mediatek/mt6895-xiaomi-rubens.dtb
            kernel-cache/.config
            boot-ubuntu.img
            rootfs-builder/out/rootfs-rubens-ubuntu-*-sparse.img
            rootfs-builder/out/KERNEL-INFO-rubens-ubuntu.txt
            SHA256SUMS
          retention-days: 30

      # ────────────────────────────────────────────── 12. 精简内核树（为缓存瘦身）
      # 实测 modules_install **一个 .o 都不需要**（它只读 modules.order 与 .ko；
      # scripts/Makefile.modinst:122 的规则是 `$(dst)/%.ko: %.ko FORCE`，
      # 前置是 .ko 而不是 .o）。删掉 .o 后树从 9.9 GB 降到 4.6 GB，压缩后约 1 GB。
      #
      # 删的是 kernel-cache/（要存的那份），不是 kernel/：
      # 此时 rootfs 已经构建完，kernel/ 只是源码树，留着不影响。
      # .git 必须保留 —— build.sh 要在 KERNEL_REPO 里跑 git archive 铺源码。
      - name: 精简内核缓存（删 .o）
        if: env.SKIP_KERNEL_BUILD != '1'
        run: |
          set -euxo pipefail
          BEFORE=$(du -sm kernel-cache | cut -f1)
          find kernel-cache -name '*.o' -delete
          find kernel-cache -name '.*.o.cmd' -delete
          AFTER=$(du -sm kernel-cache | cut -f1)
          echo "删掉 .o：${BEFORE} MB -> ${AFTER} MB"
          for f in arch/arm64/boot/Image .config Module.symvers \
                   include/config/kernel.release modules.order .git; do
            [ -e "kernel-cache/$f" ] || { echo "::error::缓存内容缺 $f"; exit 1; }
          done
          N=$(find kernel-cache -name '*.ko' | wc -l)
          [ "$N" -gt 1500 ] || { echo "::error::模块数异常: $N"; exit 1; }
          echo "缓存内容自检通过（$N 个 .ko）"

      # ────────────────────────────────────────────── 12b. 保存内核缓存（跨 run 复用）
      #
      # 「在新开的一次 action 里直接跳过内核编译」靠这一步。缓存键含内核来源、
      # 内核配置与补丁的指纹，所以它们一变就会自动重建，不会用错缓存。
      # 放在流程最末尾：只有前面的构建都成功了才值得把产物存起来。
      - name: 保存内核缓存
        if: env.SKIP_KERNEL_BUILD != '1'
        uses: actions/cache/save@v4
        with:
          path: kernel-cache
          key: >-
            kernel-${{ env.CACHE_VERSION }}-${{
              format('{0}-{1}', steps.src.outputs.commit, hashFiles('configs/kernel.config', 'configs/mt6895-fixups.config', 'patches/0001-rubens-port-fixes.patch'))
            }}


      - name: 写入构建摘要
        if: always()
        run: ./scripts/ci-summary.sh "$KERNEL_DIR" >> "$GITHUB_STEP_SUMMARY"
